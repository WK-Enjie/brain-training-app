<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mystery Grid Reveal</title>
    <link rel="stylesheet" href="style.css">

    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['\\(', '\\)']],
                displayMath: [['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global', scale: 0.88 },
            options: { enableMenu: false, renderActions: { addMenu: [0, '', ''] } },
            startup: { typeset: false }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
</head>
<body>

    <section id="launcher-screen" class="screen active">
        <div class="launcher-container">
            <h1>🔍 Mystery Grid Reveal</h1>
            <p class="tagline">Solve questions. Reveal the hidden image.</p>
            <div id="worksheet-list"><p class="loading-msg">Loading worksheets…</p></div>
            <div id="launcher-error" class="hidden"></div>
            <p class="footer-note">Tap a worksheet to begin.</p>
        </div>
    </section>

    <section id="game-screen" class="screen">
        <div class="game-container">
            <header class="game-header">
                <button id="back-btn">← Back</button>
                <h2 id="worksheet-title"></h2>
            </header>

            <div id="image-reveal-container">
                <img id="reveal-image" src="" alt="Hidden image" />
                <div id="grid-overlay"></div>
            </div>

            <div class="question-panel">
                <div id="gamble-slot"></div>
                <p id="question-text" aria-live="polite"></p>
                <div id="options-container"></div>
                <p id="progress-tracker"></p>
            </div>
        </div>
    </section>

    <div id="end-overlay" class="hidden">
        <div class="end-card">
            <h2 id="end-title"></h2>
            <p id="end-message"></p>
            <div class="end-buttons">
                <button class="end-btn retry hidden" id="retry-btn">Try Again</button>
                <button class="end-btn" id="end-back-btn">Choose Another</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
